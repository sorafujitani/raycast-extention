# Public extensions only. Keep company tools in local/ with their own lockfiles.
packages:
  - raytodo
  - gh-assigned
  - ray-dsl-viewer

# Always run postinstall, including when dependencies are already current.
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true

# Vite+ bundles Vite under its own release version.
peerDependencyRules:
  allowedVersions:
    "@vitest/mocker>vite": "0.3.1"
    "vitest>vite": "0.3.1"
